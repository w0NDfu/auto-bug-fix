name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tools
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff mypy
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy autobugfix
      - name: CLI smoke test
        run: autobugfix --help

